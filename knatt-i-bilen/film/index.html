<style>
:root { --glod: #FF4D38; --blekk: #0E1116; --bein: #F0EFEC; --natt-edge: #252932; --body: 'Inter', system-ui, -apple-system, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; color: var(--bein); font-family: var(--body); overflow: hidden; }
.stage {
  position: absolute; left: 50%; top: 50%;
  width: min(100vw, calc(100vh * 16 / 9)); height: min(100vh, calc(100vw * 9 / 16));
  transform: translate(-50%, -50%); overflow: hidden; background: var(--blekk);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* Tekstlaget er det samme som i videoen (overlay.html), skalert fra 1920×1080 */
#overlay { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; }
.fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

.start {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 10, 14, .35);
  border: 0; cursor: pointer; color: var(--bein); font: 500 16px var(--body); transition: opacity .3s ease;
}
.start span { display: inline-flex; align-items: center; gap: 12px; padding: 16px 24px; border-radius: 999px; background: var(--glod); color: var(--blekk); box-shadow: 0 10px 40px rgba(255, 77, 56, .45); }
.start.hidden { opacity: 0; pointer-events: none; }

.controls { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; z-index: 10; }
.controls button, .controls a {
  font: 500 13px var(--body); color: var(--bein); background: rgba(21, 24, 30, .82); border: 1px solid var(--natt-edge);
  padding: 9px 14px; border-radius: 10px; cursor: pointer; text-decoration: none;
}
.controls button:hover, .controls a:hover { border-color: var(--glod); }
.capture .controls, .capture .start, .capture .rotate { display: none; }
.controls { transition: opacity .4s ease; }
body.playing.idle .controls { opacity: 0; pointer-events: none; }
.rotate { display: none; position: fixed; left: 0; right: 0; bottom: 84px; text-align: center; font: 500 14px var(--body); color: var(--bein); opacity: .75; }
@media (orientation: portrait) and (max-width: 700px) {
  .rotate { display: block; }
  .start span { font-size: 13px; padding: 10px 16px; gap: 8px; }
  .controls { left: 12px; right: 12px; justify-content: center; flex-wrap: wrap; }
}
</style>

<script type="module">
import * as THREE from 'three';

const DUR = 26;
const T = { c1: [0, 5.75], c2: [5.75, 11.25], c3: [11.25, 16.75], c4: [16.75, 22.25], end: [22.25, 26] }; // samme som videoen
const CAPTURE = new URLSearchParams(location.search).has('capture');
if (CAPTURE) document.documentElement.classList.add('capture');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const inS = (t, k) => t >= T[k][0] && t < T[k][1];
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ───────── Renderer ───────── */
const stage = document.getElementById('stage');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: CAPTURE });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 16 / 9, 0.02, 900);
scene.fog = new THREE.Fog('#41507a', 40, 520);

function glowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTex();
const glow = (color, size, opacity = 1) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); s.scale.setScalar(size); return s; };

/* ───────── Himmel i blåtimen ───────── */
const sky = new THREE.Mesh(new THREE.SphereGeometry(800, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#141c33') }, mid: { value: new THREE.Color('#3d4c7c') }, hor: { value: new THREE.Color('#e3927e') }, sun: { value: new THREE.Vector3(0.55, 0.02, -1).normalize() } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 hor; uniform vec3 sun; varying vec3 vDir;
    void main(){ float y = vDir.y; vec3 c = mix(mid, top, smoothstep(0.05, 0.6, y));
      float glow = pow(max(dot(normalize(vec3(vDir.x, 0.0, vDir.z)), normalize(vec3(sun.x,0.0,sun.z))), 0.0), 3.0) * (1.0 - smoothstep(0.0, 0.22, y));
      c = mix(c, hor, clamp(glow * 0.95 + (1.0 - smoothstep(-0.02, 0.08, y)) * 0.35, 0.0, 1.0));
      gl_FragColor = vec4(c, 1.0); }`,
}));
scene.add(sky);

/* ───────── Landskap: vei, snø, islagt Mjøsa, åser med gårdslys ───────── */
const world = new THREE.Group(); scene.add(world);
const L = 200;
function noiseTex(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); fn(g, w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
const r0 = rng(5);
const asphaltTex = noiseTex(256, 1024, (g, w, h) => {
  g.fillStyle = '#2b2f37'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const v = 35 + r0() * 40; g.fillStyle = `rgba(${v},${v + 4},${v + 12},.35)`; g.fillRect(r0() * w, r0() * h, 1.5, 1.5); }
  // snøspor mellom hjulsporene og langs kantene
  for (const [x0, ww, a] of [[0, 34, .75], [60, 22, .45], [118, 20, .55], [174, 22, .45], [222, 34, .75]]) { const gr = g.createLinearGradient(x0, 0, x0 + ww, 0); gr.addColorStop(0, 'rgba(210,222,240,0)'); gr.addColorStop(.5, `rgba(210,222,240,${a})`); gr.addColorStop(1, 'rgba(210,222,240,0)'); g.fillStyle = gr; g.fillRect(x0, 0, ww, h); }
});
asphaltTex.repeat.set(1, 30);
const road = new THREE.Mesh(new THREE.PlaneGeometry(8, 800), new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.55, metalness: 0.05 }));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0.01, -300); world.add(road);
const snowGround = new THREE.Mesh(new THREE.PlaneGeometry(120, 800), new THREE.MeshStandardMaterial({ color: '#c8d3e6', roughness: 0.95 }));
snowGround.rotation.x = -Math.PI / 2; snowGround.position.set(-56, 0, -300); world.add(snowGround);
const bank = new THREE.Mesh(new THREE.PlaneGeometry(6, 800), new THREE.MeshStandardMaterial({ color: '#d4deee', roughness: 0.95 }));
bank.rotation.x = -Math.PI / 2; bank.position.set(7, 0.005, -300); world.add(bank);
// isen og en råk med åpent vann
const iceTex = noiseTex(512, 512, (g, w, h) => {
  g.fillStyle = '#b8c6dc'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++) { g.strokeStyle = `rgba(255,255,255,${0.08 + r0() * 0.12})`; g.lineWidth = 1 + r0() * 2; g.beginPath(); let x = r0() * w, y = r0() * h; g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (r0() - .5) * 90; y += (r0() - .5) * 90; g.lineTo(x, y); } g.stroke(); }
});
iceTex.repeat.set(6, 20);
const ice = new THREE.Mesh(new THREE.PlaneGeometry(400, 1400), new THREE.MeshStandardMaterial({ map: iceTex, roughness: 0.62, metalness: 0.05 }));
ice.rotation.x = -Math.PI / 2; ice.position.set(210, -0.05, -500); scene.add(ice);
const waterTex = noiseTex(64, 512, (g, w, h) => { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2a3354'); gr.addColorStop(.5, '#6b5a78'); gr.addColorStop(1, '#2a3354'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
const water = new THREE.Mesh(new THREE.PlaneGeometry(70, 1400), new THREE.MeshStandardMaterial({ map: waterTex, roughness: 0.08, metalness: 0.6, emissive: '#2a2440', emissiveIntensity: 0.6 }));
water.rotation.x = -Math.PI / 2; water.position.set(120, -0.03, -500); scene.add(water);
// åsene på den andre siden med gårdslys
{
  const r = rng(9); const hills = new THREE.Group(); scene.add(hills);
  const hillMat = new THREE.MeshStandardMaterial({ color: '#232c44', roughness: 1, flatShading: true });
  for (let i = 0; i < 26; i++) { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), hillMat); m.scale.set(30 + r() * 40, 8 + r() * 12, 30 + r() * 30); m.position.set(250 + r() * 60, -2, -60 - i * 38 - r() * 20); hills.add(m); }
  const lights = []; for (let i = 0; i < 70; i++) lights.push(222 + r() * 30, 0.6 + r() * 3, -40 - r() * 900);
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lights, 3));
  scene.add(new THREE.Points(lg, new THREE.PointsMaterial({ color: '#ffcf8a', size: 1.6, map: GLOW, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })));
  for (let i = 0; i < 14; i++) { const s = glow('#ff9a5a', 1, 0.12); s.scale.set(0.6, 5, 1); s.position.set(170 + r() * 50, 0.2, -60 - r() * 500); scene.add(s); } // refleksjoner i vannet
}

const movers = [];
function instanced(geo, mat, places) { const im = new THREE.InstancedMesh(geo, mat, places.length); world.add(im); movers.push({ im, base: places }); return im; }
// gul midtlinje
instanced(new THREE.BoxGeometry(0.12, 0.01, 3), new THREE.MeshBasicMaterial({ color: '#d9b744' }), Array.from({ length: 34 }, (_, i) => ({ x: 0, y: 0.015, z: -i * (L / 34), s: 1 })));
// brøytestikker med oransje topp
const poleGeo = new THREE.CylinderGeometry(0.03, 0.03, 2.1, 6); poleGeo.translate(0, 1.05, 0);
const tipGeo = new THREE.CylinderGeometry(0.035, 0.035, 0.55, 6); tipGeo.translate(0, 1.85, 0);
const polePlaces = Array.from({ length: 50 }, (_, i) => ({ x: i % 2 ? 4.6 : -4.6, y: 0, z: -Math.floor(i / 2) * 8 - (i % 2) * 4, s: 1 }));
instanced(poleGeo, new THREE.MeshStandardMaterial({ color: '#15181e', roughness: 0.8 }), polePlaces);
instanced(tipGeo, new THREE.MeshStandardMaterial({ color: '#ff5a1f', emissive: '#ff3d10', emissiveIntensity: 0.9 }), polePlaces);
// snøtunge graner
const treeBase = (() => { const r = rng(7); return Array.from({ length: 260 }, () => ({ x: -(7 + r() * 45), y: 0, z: -r() * L, s: 0.7 + r() * 1.1 })); })();
const tBody = new THREE.ConeGeometry(1.25, 8, 8); tBody.translate(0, 4, 0);
const tSnow1 = new THREE.ConeGeometry(1.05, 2.4, 8); tSnow1.translate(0, 6.9, 0);
const tSnow2 = new THREE.ConeGeometry(1.3, 1.6, 8, 1, true); tSnow2.translate(0, 4.4, 0);
instanced(tBody, new THREE.MeshStandardMaterial({ color: '#16241f', roughness: 1, flatShading: true }), treeBase);
instanced(tSnow1, new THREE.MeshStandardMaterial({ color: '#e4ebf6', roughness: 1, flatShading: true }), treeBase);
instanced(tSnow2, new THREE.MeshStandardMaterial({ color: '#dbe4f2', roughness: 1, flatShading: true, side: THREE.DoubleSide }), treeBase);
// busker i snøen mot isen
const bushBase = (() => { const r = rng(17); return Array.from({ length: 90 }, () => ({ x: 6 + r() * 4, y: 0, z: -r() * L, s: 0.5 + r() * 0.6 })); })();
const bush = new THREE.ConeGeometry(0.5, 1.4, 5); bush.translate(0, 0.7, 0);
instanced(bush, new THREE.MeshStandardMaterial({ color: '#4a4048', roughness: 1, flatShading: true }), bushBase);
// baklys langt fremme
const ahead = new THREE.Group(); world.add(ahead);
for (const x of [-0.5, 0.5]) { const g = glow('#ff2a1a', 1.2, 0.9); g.position.set(x, 0.8, 0); ahead.add(g); }

/* ───────── Bilen (dronebildet) ───────── */
const car = new THREE.Group(); scene.add(car);
{
  const white = new THREE.MeshPhysicalMaterial({ color: '#eef1f5', roughness: 0.25, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.1 });
  const glass = new THREE.MeshPhysicalMaterial({ color: '#0b0e14', roughness: 0.05, metalness: 0.6 });
  // sideprofil (z bakover er positiv), ekstrudert i bredden
  const prof = (pts, w) => { const sh = new THREE.Shape(pts.map(([z, y]) => new THREE.Vector2(z, y))); const g = new THREE.ExtrudeGeometry(sh, { depth: w, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08, bevelSegments: 4, curveSegments: 12 }); g.translate(0, 0, -w / 2); g.rotateY(Math.PI / 2); return g; };
  const body = new THREE.Mesh(prof([[2.35, 0.3], [2.4, 0.78], [2.15, 0.98], [-1.55, 0.98], [-2.3, 0.82], [-2.4, 0.38], [-2.2, 0.25], [2.2, 0.25]], 1.78), white); car.add(body);
  const cabin = new THREE.Mesh(prof([[2.05, 0.98], [1.0, 1.56], [-0.5, 1.6], [-1.5, 0.98]], 1.5), glass); car.add(cabin);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.06, 0.04), new THREE.MeshBasicMaterial({ color: '#ff2a1a' })); bar.position.set(0, 0.84, 2.5); car.add(bar);
  for (const x of [-0.72, 0.72]) { const g = glow('#ff3020', 1.6, 1); g.position.set(x, 0.86, 2.55); car.add(g); }
  const wheelGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.26, 20); wheelGeo.rotateZ(Math.PI / 2);
  for (const [x, z] of [[-0.95, -1.45], [0.95, -1.45], [-0.95, 1.45], [0.95, 1.45]]) { const w = new THREE.Mesh(wheelGeo, new THREE.MeshStandardMaterial({ color: '#111', roughness: 0.8 })); w.position.set(x, 0.36, z); car.add(w); }
  const beam = new THREE.SpotLight('#fff4e0', 90, 70, 0.4, 0.5, 1.5); beam.position.set(0, 0.8, -2.4); beam.target.position.set(0, 0, -30); car.add(beam, beam.target);
  const pool = glow('#ffe9c8', 9, 0.18); pool.position.set(0, 0.05, -9); pool.scale.set(5, 12, 1); car.add(pool);
}
car.position.set(1.4, 0, -6);
{ const fill = new THREE.PointLight('#c9d6ff', 18, 14, 1.6); fill.position.set(0, 4, 2); car.add(fill); }

/* ───────── Kupeen: dashbord, lysstripe, ratt og skjermen med Grok ───────── */
const cabinGroup = new THREE.Group(); scene.add(cabinGroup);
const screenTex = new THREE.TextureLoader().load('skjerm.webp', () => { ready.tex = true; });
screenTex.colorSpace = THREE.SRGBColorSpace; screenTex.anisotropy = 8;
const SW = 0.92, SH = SW * 9 / 16;
const screen = new THREE.Group();
{
  const dash = new THREE.Mesh(new THREE.BoxGeometry(3, 0.35, 0.9), new THREE.MeshStandardMaterial({ color: '#0d1015', roughness: 0.7 })); dash.position.set(0, 0.62, -1.0); cabinGroup.add(dash);
  const strip = new THREE.Mesh(new THREE.BoxGeometry(3, 0.008, 0.01), new THREE.MeshBasicMaterial({ color: '#cfd8ff', toneMapped: false })); strip.position.set(0, 0.74, -0.55); cabinGroup.add(strip);
  const stripGlow = glow('#8fa2ff', 1, 0.25); stripGlow.scale.set(3, 0.06, 1); stripGlow.position.set(0, 0.74, -0.54); cabinGroup.add(stripGlow);
  const frame = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 0.6), new THREE.MeshBasicMaterial({ color: '#07080b' })); frame.position.set(0, 2.02, -0.9); cabinGroup.add(frame); // takkant
  for (const x of [-1.45, 1.45]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.4, 0.08), new THREE.MeshBasicMaterial({ color: '#07080b' })); p.position.set(x, 1.3, -0.95); p.rotation.z = x < 0 ? -0.35 : 0.35; cabinGroup.add(p); }
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.028, 12, 48), new THREE.MeshStandardMaterial({ color: '#0c0d10', roughness: 0.5 })); wheel.position.set(-0.36, 0.86, -0.42); wheel.rotation.x = -0.35; cabinGroup.add(wheel);
  const bezel = new THREE.Mesh(new THREE.BoxGeometry(SW + 0.03, SH + 0.03, 0.02), new THREE.MeshStandardMaterial({ color: '#050608', roughness: 0.3 })); screen.add(bezel);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ map: screenTex, toneMapped: false })); panel.position.z = 0.011; screen.add(panel);
  const stalk = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.05), new THREE.MeshStandardMaterial({ color: '#0d1015' })); stalk.position.set(0, -SH / 2 - 0.06, -0.02); screen.add(stalk);
  screen.position.set(-0.1, 0.97, -0.62); screen.rotation.set(-0.1, -0.05, 0); cabinGroup.add(screen);
}
// Lysende puls langs ruta på kartet (pikselkoordinater i skjermbildet)
const routePx = [[1222, 218], [1240, 280], [1258, 335], [1275, 390], [1290, 440], [1310, 490], [1340, 555], [1400, 545], [1450, 528], [1510, 505], [1570, 488], [1640, 482], [1652, 540], [1665, 600], [1670, 660], [1672, 707], [1678, 780], [1683, 850], [1686, 905]];
const routeLocal = new THREE.CatmullRomCurve3(routePx.map(([x, y]) => new THREE.Vector3((x / 1920 - 0.5) * SW, (0.5 - y / 1080) * SH, 0.013)));
const pulses = []; for (let i = 0; i < 26; i++) { const g = glow('#bfe0ff', 0.03, 0); screen.add(g); pulses.push(g); }

/* ───────── Lys og snø ───────── */
scene.add(new THREE.HemisphereLight('#8ea6dc', '#2a3046', 1.35));
const dusk = new THREE.DirectionalLight('#f0a790', 0.35); dusk.position.set(60, 18, -120); scene.add(dusk);
const SN = 2400, snowBase = new Float32Array(SN * 3), snowPos = new Float32Array(SN * 3);
{ const r = rng(3); for (let i = 0; i < SN; i++) { snowBase[i * 3] = (r() - 0.5) * 50; snowBase[i * 3 + 1] = r() * 16; snowBase[i * 3 + 2] = -r() * 70; } }
const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: '#ffffff', size: 0.06, map: GLOW, transparent: true, opacity: 0.8, depthWrite: false }));
scene.add(snow);

/* ───────── Oppdatering ───────── */
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v3 = new THREE.Vector3(), sc = new THREE.Vector3();
function updateWorld(t) {
  const d = t * 22;
  for (const { im, base } of movers) {
    for (let i = 0; i < base.length; i++) { const b = base[i]; const z = ((b.z + d) % L + L) % L - L + 8; v3.set(b.x, b.y, z); sc.setScalar(b.s); m4.compose(v3, q, sc); im.setMatrixAt(i, m4); }
    im.instanceMatrix.needsUpdate = true;
  }
  asphaltTex.offset.y = (d / 800 * 30) % 1;
  for (let i = 0; i < SN; i++) {
    snowPos[i * 3] = snowBase[i * 3] + Math.sin(t * 0.7 + i) * 0.3 + camera.position.x;
    snowPos[i * 3 + 1] = ((snowBase[i * 3 + 1] - t * 1.4) % 16 + 16) % 16;
    snowPos[i * 3 + 2] = ((snowBase[i * 3 + 2] + t * 12) % 70 + 70) % 70 - 66 + camera.position.z;
  }
  snowGeo.attributes.position.needsUpdate = true;
  ahead.position.set(-1.6 + Math.sin(t * 0.4) * 0.2, 0, -90 - Math.sin(t * 0.25) * 8);
}
const tmp = new THREE.Vector3(), nrm = new THREE.Vector3();
function screenPoint(x, y, dist) { screen.updateMatrixWorld(); const p = screen.localToWorld(new THREE.Vector3(x, y, 0)); nrm.set(0, 0, 1).transformDirection(screen.matrixWorld); return { look: p, pos: p.clone().addScaledVector(nrm, dist) }; }
const POV = { pos: new THREE.Vector3(-0.36, 1.2, 0.18), look: new THREE.Vector3(-0.1, 1.0, -12) };
function setCam(pos, look, fov) { camera.position.copy(pos); camera.lookAt(look); camera.fov = fov; camera.updateProjectionMatrix(); }
function updateCamera(t) {
  const sway = Math.sin(t * 1.3) * 0.006;
  if (t < T.c2[0]) { // sjåførens blikk, sakte inn mot skjermen
    const k = t / T.c2[0]; const p = POV.pos.clone().lerp(new THREE.Vector3(-0.3, 1.16, 0.06), ease(k) * 0.6); p.y += sway; setCam(p, POV.look.clone().lerp(screen.position, 0.012 * k), 60);
  } else if (t < T.c3[0]) { // inn mot Grok-kortet
    const k = ease(clamp((t - T.c2[0]) / (T.c2[1] - T.c2[0]))); const a = screenPoint(-0.03, 0.0, 0.62), b = screenPoint(-0.2, -0.07, 0.3);
    setCam(a.pos.clone().lerp(b.pos, k).add(new THREE.Vector3(0, sway, 0)), a.look.clone().lerp(b.look, k), lerp(52, 44, k));
  } else if (t < T.c4[0] || t >= T.end[0]) { // drone bak bilen
    const k = t >= T.end[0] ? 1 + (t - T.end[0]) / 6 : (t - T.c3[0]) / (T.c3[1] - T.c3[0]);
    setCam(new THREE.Vector3(lerp(0.6, 0.2, k), lerp(6.5, 10, k), lerp(9, 11, k)), new THREE.Vector3(2.5, 0, -24), 50);
  } else { // kartet: sakte fra venstre mot høyre
    const k = ease(clamp((t - T.c4[0]) / (T.c4[1] - T.c4[0]))); const a = screenPoint(0.05, 0.02, 0.4), b = screenPoint(0.2, -0.01, 0.3);
    setCam(a.pos.clone().lerp(b.pos, k), a.look.clone().lerp(b.look, k), 46);
  }
}
function updatePulses(t) {
  const on = inS(t, 'c4');
  const head = clamp((t - T.c4[0] - 0.3) / 3.4);
  pulses.forEach((g, i) => {
    const u = head - i * 0.012; g.visible = on && u > 0;
    if (!g.visible) return; routeLocal.getPointAt(clamp(u), g.position);
    const f = 1 - i / pulses.length; g.material.opacity = 0.55 * f; g.scale.setScalar(lerp(0.006, 0.016, f));
  });
}

/* ───────── Tekstlaget (samme som videoen) ───────── */
const ov = document.getElementById('overlay');
const ready = { tex: false, ov: false };
ov.addEventListener('load', () => { const w = ov.contentWindow; const wait = () => (w.__ready ? (ready.ov = true) : setTimeout(wait, 50)); wait(); });
function scaleOverlay() { ov.style.transform = `scale(${stage.clientWidth / 1920})`; }

function renderAt(t) {
  t = clamp(t, 0, DUR - 0.001);
  const inside = t < T.c3[0] || inS(t, 'c4');
  cabinGroup.visible = inside;
  car.visible = !inside;
  updateWorld(t);
  updatePulses(t);
  updateCamera(t);
  renderer.render(scene, camera);
  if (ready.ov && ov.contentWindow.__renderAt) ov.contentWindow.__renderAt(t);
  let f = 0; for (const b of [T.c2[0], T.c3[0], T.c4[0], T.end[0]]) f = Math.max(f, 1 - clamp(Math.abs(t - b) / 0.25));
  document.getElementById('fade').style.opacity = Math.max(f * 0.85, 1 - clamp(t / 0.5), clamp((t - 25.4) / 0.6));
}
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); scaleOverlay(); }
addEventListener('resize', resize); resize();

/* ───────── Avspilling med lyd i takt ───────── */
const lyd = document.getElementById('lyd'), start = document.getElementById('start'), play = document.getElementById('play'), mute = document.getElementById('mute');
let playing = false, t0 = 0, clockStart = 0;
const now = () => (playing ? (lyd.muted || lyd.paused ? (performance.now() - clockStart) / 1000 : lyd.currentTime) : t0);
function go(from) {
  t0 = from; clockStart = performance.now() - from * 1000; playing = true; play.textContent = 'Pause'; start.classList.add('hidden'); document.body.classList.add('playing'); poke();
  lyd.currentTime = from; lyd.play().catch(() => {}); loop();
}
function stop() { t0 = now(); playing = false; play.textContent = 'Spill'; lyd.pause(); document.body.classList.remove('playing'); }
let idleTimer; function poke() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500); }
['pointerdown', 'pointermove', 'keydown', 'touchstart'].forEach((e) => addEventListener(e, poke, { passive: true }));
function loop() {
  if (!playing) return; const t = now();
  if (t >= DUR) { playing = false; document.body.classList.remove('playing', 'idle'); play.textContent = 'Spill igjen'; t0 = DUR - 0.01; renderAt(t0); return; }
  renderAt(t); requestAnimationFrame(loop);
}
start.onclick = () => go(0);
play.onclick = () => (playing ? stop() : go(t0 >= DUR - 0.05 ? 0 : t0));
document.getElementById('replay').onclick = () => go(0);
mute.onclick = () => { const t = now(); lyd.muted = !lyd.muted; mute.textContent = lyd.muted ? 'Lyd på' : 'Lyd av'; if (playing) { clockStart = performance.now() - t * 1000; if (!lyd.muted) lyd.currentTime = t; } };

window.__DUR = DUR;
window.__renderAt = (t) => { renderAt(t); return true; };
window.__isReady = () => ready.tex && ready.ov;
(function first() { if (ready.tex && ready.ov) { renderAt(reduce && !CAPTURE ? 23.5 : 0.6); } else setTimeout(first, 60); })();
</script>
